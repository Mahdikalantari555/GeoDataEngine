name: metric-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  
  # Core scientific computing
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - xarray>=2023.1
  - dask>=2023.1
  
  # Geospatial dependencies (from conda-forge for binary packages)
  - geopandas>=0.14
  - rasterio>=1.3
  - rioxarray>=0.14
  - shapely>=2.0
  - pyproj>=3.6
  - fiona>=1.9
  
  # Visualization
  - matplotlib>=3.7
  - seaborn>=0.12
  - cartopy>=0.22
  
  # Configuration and CLI
  - click>=8.1
  - pyyaml>=6.0
  - requests>=2.28
  
  # Logging and progress
  - loguru>=0.7
  - tqdm>=4.65
  
  # Testing
  - pytest>=8.0
  - pytest-cov>=5.0
  
  # Optional: NetCDF support
  - netcdf4>=1.6
  - cftime>=1.6
  - zarr>=2.14
  
  # pip packages (if not available in conda)
  - pip>=21.0
  - pip:
    - geojson>=3.1

variables:
  # Optional environment variables
  MPLBACKEND: Agg  # Non-interactive backend for headless servers

prefix: /path/to/anaconda3/envs/metric-env
